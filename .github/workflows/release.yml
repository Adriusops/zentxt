name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Build macOS app
        run: wails3 build
        env:
          CGO_ENABLED: 1

      - name: Package .app bundle
        run: |
          mkdir -p zentxt.app/Contents/MacOS
          mkdir -p zentxt.app/Contents/Resources
          cp bin/zentxt zentxt.app/Contents/MacOS/zentxt
          cp build/darwin/icons.icns zentxt.app/Contents/Resources/icons.icns
          cp build/darwin/Info.plist zentxt.app/Contents/Info.plist
          zip -r zentxt-mac.zip zentxt.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zentxt-mac
          path: zentxt-mac.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Build Windows app
        run: go build -o zentxt-windows.exe ./cmd/zentxt/
        env:
          CGO_ENABLED: 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zentxt-windows
          path: zentxt-windows.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux dependencies
        run: sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Build Linux app
        run: go build -o zentxt-linux ./cmd/zentxt/
        env:
          CGO_ENABLED: 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zentxt-linux
          path: zentxt-linux

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries/

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: binaries/**/*
