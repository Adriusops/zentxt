name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Clone le repo dans la machine virtuelle qui exécute le workflow
      - name: Setup Go
        uses: actions/setup-go@v4 #Go runner, utiliser la version 1.25
        with:
          go-version: 1.26
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: Generate Wails bindings
        run: wails3 generate bindings ./cmd/zentxt/...
      - name: Build vite
        working-directory: frontend
        run: npm install && npm run build
      - name: Build Go
        run: go build -v ./...
      - name: Test
        run: go test -v ./...
