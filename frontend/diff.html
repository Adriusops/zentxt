<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZenTxt - Diff</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url("https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap");

        body {
            font-family: "Inter", system-ui, -apple-system, sans-serif;
        }

        h1, h2, h3, h4, h5, h6, .font-display {
            font-family: "Space Mono", monospace;
        }
    </style>
</head>
<body class="bg-white text-gray-900 antialiased">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="border-b border-gray-100">
            <div class="max-w-5xl mx-auto px-6 py-6">
                <a
                    href="index.html"
                    class="inline-block hover:opacity-60 transition-opacity"
                >
                    <img
                        src="/public/logo_combo.svg"
                        alt="ZenTxt"
                        class="h-12"
                    />
                </a>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-5xl mx-auto px-6 py-12">
            <div class="space-y-8">
                <!-- Header -->
                <div>
                    <a id="back-link" href="#" class="text-sm text-gray-400 hover:text-gray-600 transition-colors inline-flex items-center mb-2">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                        Back to timeline
                    </a>
                    <h1 class="text-3xl font-light text-[#232323] mb-2">Comparing versions</h1>
                    <p id="file-name" class="text-sm text-gray-400">Loading...</p>
                </div>

                <!-- Version Info -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="border border-gray-200 rounded-lg p-4 bg-gray-50">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="inline-block px-2 py-0.5 bg-white text-gray-600 text-xs font-medium rounded border border-gray-200">
                                Before
                            </span>
                            <span id="version1-message" class="text-sm font-medium text-[#232323]">Loading...</span>
                        </div>
                        <div class="flex items-center gap-3 text-xs text-gray-400">
                            <span id="version1-author">-</span>
                            <span>"</span>
                            <span id="version1-date">-</span>
                        </div>
                    </div>

                    <div class="border border-gray-200 rounded-lg p-4 bg-gray-50">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="inline-block px-2 py-0.5 bg-white text-gray-600 text-xs font-medium rounded border border-gray-200">
                                After
                            </span>
                            <span id="version2-message" class="text-sm font-medium text-[#232323]">Loading...</span>
                        </div>
                        <div class="flex items-center gap-3 text-xs text-gray-400">
                            <span id="version2-author">-</span>
                            <span>"</span>
                            <span id="version2-date">-</span>
                        </div>
                    </div>
                </div>

                <!-- View Toggle -->
                <div class="flex items-center gap-2">
                    <button
                        id="unified-btn"
                        class="px-4 py-2 bg-[#232323] text-white rounded-lg text-sm font-medium transition-opacity">
                        Unified
                    </button>
                    <button
                        id="split-btn"
                        class="px-4 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-200 transition-colors">
                        Side by side
                    </button>
                </div>

                <!-- Diff Content - Unified View -->
                <div id="unified-view" class="border border-gray-200 rounded-xl overflow-hidden">
                    <div class="bg-gray-50 px-4 py-2 border-b border-gray-200">
                        <span class="text-xs font-medium text-gray-600">Changes</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm font-mono">
                            <tbody id="unified-tbody">
                                <!-- Diff will be rendered here -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Diff Content - Split View -->
                <div id="split-view" class="hidden grid grid-cols-2 gap-4">
                    <div class="border border-gray-200 rounded-xl overflow-hidden">
                        <div class="bg-gray-50 px-4 py-2 border-b border-gray-200">
                            <span class="text-xs font-medium text-gray-600">Before</span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-sm font-mono">
                                <tbody id="split-before-tbody">
                                    <!-- Before diff will be rendered here -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="border border-gray-200 rounded-xl overflow-hidden">
                        <div class="bg-gray-50 px-4 py-2 border-b border-gray-200">
                            <span class="text-xs font-medium text-gray-600">After</span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-sm font-mono">
                                <tbody id="split-after-tbody">
                                    <!-- After diff will be rendered here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { GetFile, GetVersion, GenerateDiff } from "./bindings/github.com/Adriusops/zentxt/cmd/zentxt/app.js";

        // Get params from URL
        const urlParams = new URLSearchParams(window.location.search);
        const fileId = urlParams.get('fileId');
        const v1 = urlParams.get('v1');
        const v2 = urlParams.get('v2');

        if (!fileId || !v1 || !v2) {
            window.location.href = 'index.html';
        }

        // Set back link
        document.getElementById('back-link').href = `timeline.html?fileId=${fileId}`;

        let currentFile = null;
        let version1 = null;
        let version2 = null;
        let diff = null;

        // Load diff
        async function loadDiff() {
            try {
                currentFile = await GetFile(fileId);
                version1 = await GetVersion(v1);
                version2 = await GetVersion(v2);
                diff = await GenerateDiff(v1, v2);

                if (!currentFile || !version1 || !version2 || !diff) {
                    alert('Failed to load diff data.');
                    window.location.href = `timeline.html?fileId=${fileId}`;
                    return;
                }

                document.getElementById('file-name').textContent = currentFile.Name;
                document.getElementById('version1-message').textContent = version1.Message;
                document.getElementById('version1-author').textContent = version1.Author;
                document.getElementById('version1-date').textContent = new Date(version1.CreatedAt).toLocaleDateString('fr-FR');
                document.getElementById('version2-message').textContent = version2.Message;
                document.getElementById('version2-author').textContent = version2.Author;
                document.getElementById('version2-date').textContent = new Date(version2.CreatedAt).toLocaleDateString('fr-FR');

                renderUnifiedDiff();
                renderSplitDiff();
            } catch (error) {
                console.error('Error loading diff:', error);
                alert('Failed to load diff. Please try again.');
                window.location.href = `timeline.html?fileId=${fileId}`;
            }
        }

        // Render unified diff
        function renderUnifiedDiff() {
            const tbody = document.getElementById('unified-tbody');

            if (!diff || diff.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="2" class="px-4 py-8 text-center text-gray-400">No changes detected</td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = diff.map(item => {
                const type = item.Type;
                const text = escapeHtml(item.Text);

                if (type === 0) {
                    // Equal
                    return `
                        <tr class="hover:bg-gray-50">
                            <td class="w-12 px-3 py-1 text-right text-gray-400 border-r border-gray-200 bg-gray-50 select-none"></td>
                            <td class="px-4 py-1 text-gray-700">${text}</td>
                        </tr>
                    `;
                } else if (type === -1) {
                    // Delete
                    return `
                        <tr class="bg-red-50 hover:bg-red-100">
                            <td class="w-12 px-3 py-1 text-right text-red-600 border-r border-red-200 bg-red-100 select-none font-medium">-</td>
                            <td class="px-4 py-1 text-red-700">${text}</td>
                        </tr>
                    `;
                } else if (type === 1) {
                    // Insert
                    return `
                        <tr class="bg-green-50 hover:bg-green-100">
                            <td class="w-12 px-3 py-1 text-right text-green-600 border-r border-green-200 bg-green-100 select-none font-medium">+</td>
                            <td class="px-4 py-1 text-green-700">${text}</td>
                        </tr>
                    `;
                }
                return '';
            }).join('');
        }

        // Render split diff
        function renderSplitDiff() {
            const beforeTbody = document.getElementById('split-before-tbody');
            const afterTbody = document.getElementById('split-after-tbody');

            if (!diff || diff.length === 0) {
                beforeTbody.innerHTML = `
                    <tr>
                        <td colspan="2" class="px-4 py-8 text-center text-gray-400">No changes</td>
                    </tr>
                `;
                afterTbody.innerHTML = `
                    <tr>
                        <td colspan="2" class="px-4 py-8 text-center text-gray-400">No changes</td>
                    </tr>
                `;
                return;
            }

            beforeTbody.innerHTML = diff.map(item => {
                const type = item.Type;
                const text = escapeHtml(item.Text);

                if (type === 0 || type === -1) {
                    // Equal or Delete
                    const rowClass = type === -1 ? 'bg-red-50 hover:bg-red-100' : 'hover:bg-gray-50';
                    const cellClass = type === -1 ? 'text-red-600 bg-red-100 border-r border-red-200' : 'text-gray-400 bg-gray-50 border-r border-gray-200';
                    const textClass = type === -1 ? 'text-red-700' : 'text-gray-700';
                    const marker = type === -1 ? '-' : '';
                    const fontWeight = type === -1 ? 'font-medium' : '';

                    return `
                        <tr class="${rowClass}">
                            <td class="w-12 px-3 py-1 text-right ${cellClass} select-none ${fontWeight}">
                                ${marker}
                            </td>
                            <td class="px-4 py-1 ${textClass}">${text}</td>
                        </tr>
                    `;
                } else {
                    // Insert - show empty row
                    return `
                        <tr class="bg-gray-100">
                            <td class="w-12 px-3 py-1 bg-gray-200 border-r border-gray-300"></td>
                            <td class="px-4 py-1"></td>
                        </tr>
                    `;
                }
            }).join('');

            afterTbody.innerHTML = diff.map(item => {
                const type = item.Type;
                const text = escapeHtml(item.Text);

                if (type === 0 || type === 1) {
                    // Equal or Insert
                    const rowClass = type === 1 ? 'bg-green-50 hover:bg-green-100' : 'hover:bg-gray-50';
                    const cellClass = type === 1 ? 'text-green-600 bg-green-100 border-r border-green-200' : 'text-gray-400 bg-gray-50 border-r border-gray-200';
                    const textClass = type === 1 ? 'text-green-700' : 'text-gray-700';
                    const marker = type === 1 ? '+' : '';
                    const fontWeight = type === 1 ? 'font-medium' : '';

                    return `
                        <tr class="${rowClass}">
                            <td class="w-12 px-3 py-1 text-right ${cellClass} select-none ${fontWeight}">
                                ${marker}
                            </td>
                            <td class="px-4 py-1 ${textClass}">${text}</td>
                        </tr>
                    `;
                } else {
                    // Delete - show empty row
                    return `
                        <tr class="bg-gray-100">
                            <td class="w-12 px-3 py-1 bg-gray-200 border-r border-gray-300"></td>
                            <td class="px-4 py-1"></td>
                        </tr>
                    `;
                }
            }).join('');
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Toggle between views
        const unifiedBtn = document.getElementById('unified-btn');
        const splitBtn = document.getElementById('split-btn');
        const unifiedView = document.getElementById('unified-view');
        const splitView = document.getElementById('split-view');

        unifiedBtn.addEventListener('click', () => {
            unifiedView.classList.remove('hidden');
            splitView.classList.add('hidden');

            unifiedBtn.classList.remove('bg-gray-100', 'text-gray-600', 'hover:bg-gray-200');
            unifiedBtn.classList.add('bg-[#232323]', 'text-white');

            splitBtn.classList.remove('bg-[#232323]', 'text-white');
            splitBtn.classList.add('bg-gray-100', 'text-gray-600', 'hover:bg-gray-200');
        });

        splitBtn.addEventListener('click', () => {
            unifiedView.classList.add('hidden');
            splitView.classList.remove('hidden');

            splitBtn.classList.remove('bg-gray-100', 'text-gray-600', 'hover:bg-gray-200');
            splitBtn.classList.add('bg-[#232323]', 'text-white');

            unifiedBtn.classList.remove('bg-[#232323]', 'text-white');
            unifiedBtn.classList.add('bg-gray-100', 'text-gray-600', 'hover:bg-gray-200');
        });

        // Load diff on page load
        document.addEventListener('DOMContentLoaded', loadDiff);
    </script>
</body>
</html>
