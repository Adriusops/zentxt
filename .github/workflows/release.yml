name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            name: zentxt-mac
          - goos: windows
            goarch: amd64
            name: zentxt-windows.exe
          - goos: linux
            goarch: amd64
            name: zentxt-linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        run: go build -o ${{ matrix.name }} ./cmd/zentxt/
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Dl artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries/
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: binaries/**/*
